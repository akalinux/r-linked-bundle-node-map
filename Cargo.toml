[package]
name = "linked-bundle-node-map"
version = "0.1.0"
edition = "2024"

[dependencies]
wasm-bindgen = "0.2.125"
pastey = "0.2.3"
js-sys = "0.3.103"
web-sys = { 
    version="0.3.103", features = [
        'CanvasRenderingContext2d',
        'CssStyleDeclaration',
        'Document',
        'DomRect',
        'Element', 
        "ErrorEvent", 
        "Event",
        'WheelEvent',
        'HtmlCanvasElement',
        "HtmlImageElement",
        "HtmlDivElement",
        'PointerEvent',
        'Node',
        'Window',
       "ResizeObserver", "ResizeObserverEntry" 
    ] 
}
gloo ={ version="0.12.0",features=['timers']}
wasm-bindgen-futures = "0.4.76"


[dev-dependencies]
approx = "0.5"
wasm-bindgen-test = "0.3.76"

[lib]
crate-type = ["cdylib","rlib"]

[profile.release]
lto = true
